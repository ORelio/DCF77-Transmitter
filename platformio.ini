[platformio]
; Allows PlatformIO to find files in the main folder (like the Arduino IDE does),
; without requiring you to create an 'src/' subfolder:
src_dir = .

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; Adjust the baud rate for the Serial Monitor to match the sketch (115200 baud):
monitor_speed = 115200

; Faster upload:
upload_speed = 921600

; Filter for clean line breaks and automatic decoding in the event of ESP crashes:
monitor_filters = 
    esp8266_exception_decoder
    default
